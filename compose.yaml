services:
  legado-tts:
    build: .
    container_name: legado-tts
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-8765}:8765"
    volumes:
      - ./data:/data
      - ./cache:/cache
    read_only: true
    tmpfs:
      - /tmp:size=128m
    security_opt:
      - no-new-privileges:true
